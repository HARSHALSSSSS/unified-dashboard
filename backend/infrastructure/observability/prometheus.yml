global:
  scrape_interval: 15s

scrape_configs:
  # Docker Desktop: host.docker.internal reaches processes started with `pnpm dev` on the host.
  - job_name: oms-api
    metrics_path: /metrics
    static_configs: [{ targets: ["api:3000", "host.docker.internal:3000"] }]
  - job_name: oms-worker
    metrics_path: /metrics
    static_configs: [{ targets: ["worker:3100", "scheduler:3100", "webhook-worker:3100"] }]

# Starter alert rules live in infrastructure/observability/alerts.yml (see docs/architecture/OBSERVABILITY.md).
rule_files: [/etc/prometheus/alerts.yml]
